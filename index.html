<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix"/>
      <a class="header__more" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="top-section">
        <label class="top-section__label" for="new-task">Add Item</label>
        <form class="top-section__form">
          <input class="input input--text top-section__input" id="new-task" type="text" />
          <!-- Using type="button" to prevent form submission and page reload -->
          <button class="button top-section__add" type="button">Add</button>  
        </form>
      </section>
      <section class="task-section">
        <h3 class="task-section__heading">Todo</h3>
        <ul class="task-list task-list--incomplete" id="incomplete-tasks">
          <li class="task-item">
            <input class="input task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Pay Bills</label>
            <input class="input input--text task-item__input" type="text" />
            <button class="button task-item__edit">Edit</button>
            <button class="button task-item__delete">
              <img class="task-item__delete-img" src="./remove.svg" alt="remove button"/>
            </button>
          </li>
          <li class="task-item task-item--edit">
            <input class="input task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Go Shopping</label>
            <input class="input input--text task-item__input" type="text" value="Go Shopping" />
            <button class="button task-item__edit">Save</button>
            <button class="button task-item__delete">
              <img class="task-item__delete-img" src="./remove.svg" alt="remove button"/>
            </button>
          </li>
        </ul>
      </section>
      <section class="task-section">
        <h3 class="task-section__heading">Completed</h3>
        <ul class="task-list task-list--completed" id="completed-tasks">
          <li class="task-item">
            <input class="input task-item__checkbox" type="checkbox" checked />
            <label class="task-item__label">See the Doctor</label>
            <input class="input input--text task-item__input" type="text"/>
            <button class="button task-item__edit">Edit</button>
            <button class="button task-item__delete">
              <img class="task-item__delete-img" src="./remove.svg" alt="remove button"/>
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
